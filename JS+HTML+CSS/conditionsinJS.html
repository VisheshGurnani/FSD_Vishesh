<html>
    <head>
        <title>
            Conditions in JavaScript
        </title>
    </head>

    <body>
        <h1>Conditions in JavaScript</h1>
        <script>
            let a = 100;
            if (a =! 100)
            {
                document.write("a is 100");
            }
            else (a == 100)
            {
                document.write("a is not 100");
            }
        </script>
    </body>
</html>
