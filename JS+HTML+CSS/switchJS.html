<html>
    <head>
        <title>Switch Statements in JS</title>
        <style>
            body{
                justify-content: center;
                text-align: center;
                margin:400px;
                font-weight: 800;
                font-size: xx-large;
                
            }

        </style>
    </head>
    <body>
        <h1>Switch Statements in JS</h1>
        <script>
            let month = Number(prompt("Enter the month"));
            switch(month)
            {
                case 1: 
                    document.write("It is January")
                    break;
                case 2: 
                    document.write("It is February")
                    break;
                case 3: 
                    document.write("It is March")
                    break;
                case 4: 
                    document.write("It is April")
                    break;
                case 5: 
                    document.write("It is May")
                    break;
                case 6: 
                    document.write("It is June")
                    break;
                case 7: 
                    document.write("It is July")
                    break;
                case 8: 
                    document.write("It is August")
                    break;
                case 9: 
                    document.write("It is September")
                    break;
                case 10: 
                    document.write("It is October")
                    break;
                case 11: 
                    document.write("It is November")
                    break;
                case 12: 
                    document.write("It is December")
                    break;
                default:
                    document.write("Invalid Input")
            }            
        </script>
    </body>
</html>
