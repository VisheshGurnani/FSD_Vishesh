<html>
<head>
    <title>Students Grading System</title>

    <style>
        body{
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(58, 56, 56);
            color: white;
        }

        .card{
            width: 600px;
            padding: 40px;
            border-radius: 40px;
            background-color: rgb(123, 163, 190);
            text-align: center;

            box-shadow: 0 0 40px rgba(0,0,0,0.4);
        }

        h1{
            margin-bottom: 25px;
        }

        input{
            width: 80%;
            padding: 10px;
            margin: 8px 0;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            outline: none;
        }

        button{
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            background: rgb(58,56,56);
            color: white;
        }

        #result{
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Students Grading System</h1>

        <input type="text" id="name" placeholder="Student Name">
        <input type="number" id="marks" placeholder="Marks (0–100)">
        <input type="text" id="semester" placeholder="Semester">
        <input type="text" id="course" placeholder="Course">
        <input type="text" id="reg" placeholder="Registration Number">

        <button onclick="calculateGrade()">Check Grade</button>

        <div id="result"></div>
    </div>

    <script>
        function calculateGrade(){
            let name = document.getElementById("name").value;
            let marks = Number(document.getElementById("marks").value);
            let sem = document.getElementById("semester").value;
            let course = document.getElementById("course").value;
            let reg = document.getElementById("reg").value;

            let grade = "";

            if (marks >= 95 && marks <= 100) grade = "O";
            else if (marks >= 90) grade = "A+";
            else if (marks >= 85) grade = "A";
            else if (marks >= 80) grade = "B+";
            else if (marks >= 75) grade = "B";
            else if (marks >= 65) grade = "C";
            else if (marks >= 50) grade = "D";
            else if (marks >= 0) grade = "FAIL";
            else grade = "Invalid Marks";

            document.getElementById("result").innerHTML =
                `Student Name: ${name}<br>
                 Marks: ${marks}<br>
                 Semester: ${sem}<br>
                 Course: ${course}<br>
                 Registration No: ${reg}<br><br>
                 <b>Grade Obtained: ${grade}</b>`;
        }
    </script>

</body>
</html>
