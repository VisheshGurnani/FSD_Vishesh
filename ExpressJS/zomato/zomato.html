<html>
    <head>
        <link rel="stylesheet" href="zomato.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
        <title>
            zomato
        </title>
        <style>
            
        </style>
    </head>

   <body>
    <section class="home">
        <video autoplay loop muted playsinline>
            <source src="./zomatoBG.mp4" type="video/mp4">
        </video>
        
        <div class="overlay"></div>
        <div class="home-content">
            <h1 class="zomato">zomato</h1>
            <h1 class="desc">India's #1 <br> food delivery app</h1>
            <h2 class="page1">Experience fast & easy online ordering <br>on the Zomato app</h2>
            
            <div class="download">
                <img class="icon1" src="./googleplay.png">
                <img class="icon2" src="./appstore.png">
            </div>
        </div>
    </section>
    

<section class="page2">

  <img src="curves.png" class="curve" alt="">

  <img src="burger.png" class="food burger" alt="">
  <img src="momos.png" class="food momos" alt="">
  <img src="pizza.png" class="food pizza" alt="">


  <div class="page2-content">
    <h2>Better food for <br> more people</h2>
    <p>
      For over a decade, we've enabled our customers to discover new tastes,
      delivered right to their doorstep
    </p>

    <div class="stats">
      <div>
        <h3>3,00,000+</h3>
        <span>restaurants</span>
      </div>

      <div>
        <h3>800+</h3>
        <span>cities</span>
      </div>

      <div>
        <h3>3 billion+</h3>
        <span>orders delivered</span>
      </div>
    </div>
  </div>

</section>

</body>
</html>
