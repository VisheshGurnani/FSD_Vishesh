<html>
<head>
    <title>Food cafe landing page</title>
    <style>

        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-image: url(./assorted-indian-recipes-food-various-spices-rice-wooden-table-92742528.png);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        .navbar{
            background-color: black;
            color: white;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 60px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
        }

        .logo{
            font-size: 26px;
            font-weight: bold;
        }

        .nav-links{
            list-style: none;
            display: flex;
            gap: 40px;
        }

        .nav-links li a{
            color: white;
            text-decoration: none;
            font-size: 18px;
        }


        form{
            text-align: center;
            margin-top: 200px;
            margin-left: auto;
            margin-right: auto;
            height: 300px;
            width: 550px;
            padding: 60px;
            border-radius: 60px;
            background-color: rgba(0,0,0,0.75);
            color: white;
            
        }

        h1{
            font-size: 40px;
            font-weight: bold;
            position: relative;
            z-index: 2;
        }

        h3{
            font-size: 20px;
        }

        button{
            background-color: rgb(225, 184, 95);
            color: black;
            border: none;
            border-radius: 60px;
            width: 120px;
            font-size: large;
            padding: 10px;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <nav class="navbar">
        <h1 class="logo">Food Cafe</h1>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Menu</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <form>
        <h1>Welcome to Food Cafe</h1>
        <h3>Fresh food and tasty coffee</h3>
        <button>Order Now</button>
    </form>

</body>
</html>
