<html>
    <head>
        <title>

        </title>
    </head>
    <body>
        <script>
            for(let a=1; a<=10; a++){
                document.write(`5*${a} = ${5*a} <br>`);
            }

            document.write("<br>");

            let i=1;
            while(i<=10){
                document.write(`6*${i} = ${6*i} <br>`);
                i++;
            }

            document.write("<br>");

            let b=1;
            do{
                document.write(`7*${b} = ${7*b} <br>`);
                b++;
            }
            while(b<=10);
            
        </script>
    </body>
</html>
