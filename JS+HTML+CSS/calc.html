<html>
<head>
    <title>Calculator Using JS</title>
    <style>
        h1{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 800;
            font-size: xx-large;
        }

        body{
            text-align: center;
            margin: 200px;
            font-family: Arial, Helvetica, sans-serif;
        }

        button{
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        p{
            font-size: 20px;
            color: chocolate;
            font-weight: 300;
        }

    </style>
</head>

<body>

    <h1>Calculator Using JS</h1>

    <script>
        let a = Number(prompt("Enter the first number for the calculator:"));
        let b = Number(prompt("Enter the second number for the calculator:"));

        let sum = (a, b) => a + b;
        let sub = (a, b) => a - b;
        let mul = (a, b) => a * b;
        let div = (a, b) => a / b;

        document.write("The first number is: " + a + "<br>");
        document.write("The second number is: " + b + "<br><br>");

        document.write("The sum is: " + sum(a, b) + "<br>");
        document.write("The difference is: " + sub(a, b) + "<br>");
        document.write("The product is: " + mul(a, b) + "<br>");
        document.write("The quotient is: " + div(a, b) + "<br><br>");


        const marriageCheck = () => {
            let age = Number(prompt("Enter the user's age:"));
            let gender = prompt("Enter the user's gender:");

            let output = "";

            if (age >= 18 && (gender === "female" || gender === "Female")) {
            output = "The User is Eligible for Marriage";
            }
            else if (age >= 21 && (gender === "male" || gender === "Male")) {
            output = "The User is Eligible for Marriage";
            }
            else {
            output = "The User is NOT Eligible for Marriage";
            }

        
        document.getElementById("result").innerHTML = output;
    };
    </script>


    <h1><b>Marriage Eligibility Calculator</b></h1>
    <p id="result"></p>
    <button onclick="marriageCheck()">Check Marriage Eligibility</button>



</body>
</html>
