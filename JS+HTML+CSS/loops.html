<html>
    <head>
        <title>
            Loops in JS
        </title>
    </head>
    <body>
        <h1>Loops in JS</h1>
        <script>
            for(let a = 0; a <= 5; a++){
                document.write("the number is: " +a + "<br>");
            }

            let i = 1
            while (i<=5){
                document.write("the number is: " +i + "<br>");
                i++;
            }

            let b = 1;
            do{
                document.write("the number is: " +b + "<br>");
                b++;
            }
            while(b<=5);
        </script>
    </body>
</html>
