<html>
    <head>  
        <title>
        Days of the Week
        </title>
    </head>
    <body>
        <h1>Days of the Week</h1>
        <script>
            let a = prompt("Enter the day");

            if (a=="Monday" ||a=="monday"){
                document.write("Today is Monday");
                }
                else if (a=="Tuesday" ||a== "tuesday"){
                document.write("Today is Tuesday");
                }
                else if (a=="Wednesday" ||a== "wednesday"){
                document.write("Today is Wednesday");
                }
                else if (a=="Thursday" ||a== "thursday"){
                document.write("Today is Thursday");
                }
                else if (a=="Friday" || a=="friday"){
                document.write("Today is Friday");
                }
                else if (a=="Saturday" ||a=="saturday"){
                document.write("Today is holiday");
                }
                else if (a=="Sunday" ||a=="sunday"){
                document.write("Today is a holiday");
                }
            else{
                document.write("Invalid Input");
            }
        </script>

    </body>
</html>
