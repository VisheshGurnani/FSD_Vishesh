<!-- Arrays: A collection of elements
 There are 2 types of Arrays: 
    1) Homogeneous: same type of datatypes
    2) Heterogeneous: different datatypes 
    
    Objects: works in key value format and cannot access all properties at the same time. Keys must be provided. -->

<html>
    <head>
        <title>
            Arrays and Objects in JS
        </title>
        <style>

        </style>

    </head>
    <body>
        <h1>Arrays and Objects in JS</h1>
        <script>
            let array = [10, 20, 30, 40, 50];
            document.write("My Homogeneous array is:" + array + "<br>");
            document.write("<br>");



            let student = ["Vishesh Gurnani", 2411021240033, 8.9, "BCA_AI_ML", "Alliance_University"];
            document.write("Student registration number is: " + student[1] + "<br>");
            document.write("<br>");
            document.write("Student name is: " + student[0] + "<br>");
            document.write("<br>");
            document.write("Student GPA is: " + student[2] + "<br>");
            document.write("<br>");
            document.write("Student course is: " + student[3] + "<br>");
            document.write("<br>");
            document.write("Student is studying in: " + student[4] + "<br>");
            document.write("<br>");



            document.write("Phone Specifications:" + "<br>");

            let mobile = {1: "Sam",
                          2: "Blue",
                          3: 16669,
                          4: "128GB",
                          5: "8GB RAM"
            };
            mobile[1] = "Samsung";
            document.write("My phone brand is:" + mobile[1] + "<br>")
            document.write("My phone color is:" + mobile[2] + "<br>")
            document.write("My phone price is:" + mobile[3] + "<br>")
            document.write("My phone storage is:" + mobile[4] + "<br>")
            document.write("My phone RAM is:" + mobile[5] + "<br>")
        </script>
    </body>
</html>
