<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <div class="calculator">
    <div class="display"></div>

    <div class="keys">
        <div class="num">7</div>
        <div class="num">8</div>
        <div class="num">9</div>
        <div class="opp">+</div>

        <div class="num">4</div>
        <div class="num">5</div>
        <div class="num">6</div>
        <div class="opp">-</div>

        <div class="num">1</div>
        <div class="num">2</div>
        <div class="num">3</div>
        <div class="opp">*</div>

        <div class="opp">C</div>
        <div class="num">0</div>
        <div class="opp">=</div>
        <div class="opp">/</div>
    </div>
</div>

</body>
</html>
